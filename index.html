
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Neslihan Yenge'ye Sürpriz</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #fce4ec; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .envelope-container { position: relative; cursor: pointer; transition: 0.5s; z-index: 10; }
        .envelope { width: 300px; height: 200px; background: #ec407a; border-radius: 5px; position: relative; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .flap { position: absolute; top: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 100px solid #d81b60; transition: 0.5s; transform-origin: top; }
        
        .card { position: absolute; top: -100px; left: 10px; width: 280px; height: 180px; background: white; border-radius: 10px; display: none; padding: 20px; text-align: center; color: #555; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: -1; transition: 0.5s; }
        
        .dancers { display: none; font-size: 60px; margin-top: 20px; }
        .dancer { display: inline-block; animation: dance 0.6s infinite alternate; }
        @keyframes dance { from { transform: translateY(0) rotate(-10deg); } to { transform: translateY(-20px) rotate(10deg); } }
        
        .flower { position: absolute; font-size: 30px; animation: fly linear forwards; z-index: 1; }
        @keyframes fly {
            from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        
        .open .flap { transform: rotateX(180deg); }
        .open .card { display: block; top: -250px; }
        .open .dancers { display: block; }
    </style>
</head>
<body>

    <div class="envelope-container" onclick="openEnvelope(this)">
        <div class="envelope">
            Neslihan Yenge'ye Sürpriz ✉️
            <div class="flap"></div>
        </div>
        <div class="card">
            <h3>İyi ki Doğdun Yengem! 🎂</h3>
            <p>Senin gibi tatlı birinin yeni yaşı her anıyla mükemmel geçsin!</p>
            <div class="dancers">
                <span class="dancer">🐼</span>
                <span class="dancer">🧸</span>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope(el) {
            el.classList.add('open');
            // Çiçek yağmurunu başlat
            setInterval(createFlower, 300);
        }

        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerHTML = ['🌸', '🌺', '🌼', '🌷'][Math.floor(Math.random() * 4)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(flower);
            setTimeout(() => flower.remove(), 6000);
        }
    </script>
</body>
</html>
